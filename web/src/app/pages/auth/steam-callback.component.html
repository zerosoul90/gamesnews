<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
  <div class="bg-slate-800 rounded-2xl p-8 max-w-md w-full border border-slate-700 text-center">
    <ng-container *ngIf="!loi; else khoiLoi">
      <div
        class="w-10 h-10 border-2 border-slate-600 border-t-blue-500 rounded-full animate-spin mx-auto mb-5"
        role="status"
        aria-label="Đang xác thực"
      ></div>
      <h1 class="text-xl font-semibold text-white mb-2">Đang xác thực với Steam…</h1>
      <p class="text-slate-400 text-sm">Chỉ mất một lát.</p>
    </ng-container>

    <ng-template #khoiLoi>
      <h1 class="text-xl font-semibold text-white mb-3">Đăng nhập không thành công</h1>
      <p class="text-red-400 mb-6">{{ loi }}</p>
      <a
        routerLink="/login"
        class="inline-block bg-blue-600 hover:bg-blue-500 text-white font-medium px-5 py-2.5 rounded-lg transition-colors"
      >
        Thử lại
      </a>
    </ng-template>
  </div>
</div>
