<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
  <div class="bg-slate-800 rounded-2xl p-8 max-w-md w-full border border-slate-700 shadow-2xl">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-white mb-2">Đăng nhập</h1>
      <p class="text-slate-400">
        GameNews dùng tài khoản Steam của bạn — không cần tạo mật khẩu riêng.
      </p>
    </div>

    <button
      type="button"
      (click)="dangNhapSteam()"
      class="w-full flex items-center justify-center gap-3 bg-[#171a21] hover:bg-[#2a3f5a] text-white font-medium px-4 py-3 rounded-lg border border-slate-600 transition-colors"
    >
      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path
          d="M11.98 2a10 10 0 0 0-9.96 9.02l5.35 2.21a2.82 2.82 0 0 1 1.6-.49h.14l2.38-3.45v-.05a3.77 3.77 0 1 1 3.77 3.77h-.09l-3.4 2.42v.12a2.83 2.83 0 0 1-5.6.55l-3.82-1.58A10 10 0 1 0 11.98 2zm-3.7 15.17.9.37a2.13 2.13 0 1 0 1.23-2.9l.94.39a1.56 1.56 0 1 1-1.2 2.88l-1.87-.74zm9.03-6.66a2.52 2.52 0 1 0-2.52-2.51 2.52 2.52 0 0 0 2.52 2.51zm0-.62a1.9 1.9 0 1 1 1.89-1.89 1.9 1.9 0 0 1-1.89 1.9z"
        />
      </svg>
      Đăng nhập với Steam
    </button>

    <p class="text-slate-500 text-sm mt-6 text-center leading-relaxed">
      Steam xác thực trực tiếp — GameNews không bao giờ nhìn thấy mật khẩu của bạn.
      Chúng tôi chỉ lưu SteamID, danh sách game và mốc đồng bộ.
    </p>
  </div>
</div>
