<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
  <div class="bg-slate-800 rounded-2xl p-8 max-w-md w-full border border-slate-700 shadow-2xl">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-white mb-2">{{ isLoginMode ? 'Đăng nhập' : 'Đăng ký' }}</h1>
      <p class="text-slate-400">
        {{ isLoginMode ? 'Chào mừng bạn quay lại với GameNews' : 'Tạo tài khoản để theo dõi game yêu thích' }}
      </p>
    </div>

    <div *ngIf="error" class="bg-red-500/10 border border-red-500/50 text-red-400 px-4 py-3 rounded-lg mb-6">
      {{ error }}
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div *ngIf="!isLoginMode">
        <label class="block text-sm font-medium text-slate-300 mb-1">Tên hiển thị</label>
        <input 
          type="text" 
          name="username" 
          [(ngModel)]="username" 
          placeholder="Tên của bạn"
          class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500 transition-colors"
          [disabled]="isLoading"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Email</label>
        <input 
          type="email" 
          name="email" 
          [(ngModel)]="email" 
          placeholder="email@example.com"
          class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500 transition-colors"
          [disabled]="isLoading"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Mật khẩu</label>
        <input 
          type="password" 
          name="password" 
          [(ngModel)]="password" 
          placeholder="••••••••"
          class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg px-4 py-2.5 focus:outline-none focus:border-blue-500 transition-colors"
          [disabled]="isLoading"
        />
      </div>

      <button 
        type="submit" 
        [disabled]="isLoading"
        class="w-full bg-blue-600 hover:bg-blue-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-3 px-4 rounded-lg transition-colors flex justify-center items-center gap-2 mt-2"
      >
        <svg *ngIf="isLoading" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        {{ isLoginMode ? 'Đăng nhập' : 'Tạo tài khoản' }}
      </button>
    </form>

    <div class="mt-8 text-center text-slate-400">
      {{ isLoginMode ? 'Chưa có tài khoản?' : 'Đã có tài khoản?' }}
      <button type="button" (click)="toggleMode()" class="text-blue-400 hover:text-blue-300 font-semibold ml-1 focus:outline-none">
        {{ isLoginMode ? 'Đăng ký ngay' : 'Đăng nhập' }}
      </button>
    </div>
  </div>
</div>
