<div class="container mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold text-white mb-2">Tôi đang theo dõi</h1>
  <p class="text-slate-400 mb-8">Game, series và studio bạn đã bấm theo dõi.</p>

  <div *ngIf="canDangNhap" class="bg-slate-800 border border-slate-700 rounded-xl p-8 text-center">
    <p class="text-slate-300 mb-5">Đăng nhập để xem danh sách theo dõi của bạn.</p>
    <a
      routerLink="/login"
      class="inline-block bg-blue-600 hover:bg-blue-500 text-white font-medium px-5 py-2.5 rounded-lg transition-colors"
    >
      Đăng nhập với Steam
    </a>
  </div>

  <div *ngIf="dangTai" class="text-slate-400">Đang tải…</div>

  <div
    *ngIf="loi"
    class="bg-red-500/10 border border-red-500/50 text-red-400 px-4 py-3 rounded-lg mb-6"
  >
    {{ loi }}
  </div>

  <div
    *ngIf="!dangTai && !canDangNhap && follows.length === 0 && !loi"
    class="bg-slate-800 border border-slate-700 rounded-xl p-8 text-center text-slate-400"
  >
    Bạn chưa theo dõi gì. Mở trang một game và bấm Theo dõi để nhận tin về nó.
  </div>

  <ul *ngIf="!dangTai && follows.length > 0" class="space-y-3">
    <li
      *ngFor="let f of follows"
      class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex items-center gap-4"
    >
      <img
        *ngIf="f.target?.cover_image_url"
        [src]="f.target?.cover_image_url"
        alt=""
        class="w-14 h-18 object-cover rounded"
      />
      <div class="flex-1 min-w-0">
        <span
          class="inline-block text-xs uppercase tracking-wide text-slate-500 mb-1"
          >{{ nhanLoai(f.target_type) }}</span
        >

        <!-- `target` là null với mọi mục không phải game. Đó là trạng thái bình
             thường, nên hiển thị bằng target_id trần thay vì coi là lỗi. -->
        <a
          *ngIf="f.target?.slug; else khongCoThe"
          [routerLink]="['/game', f.target?.slug]"
          class="block text-white font-medium hover:text-blue-400 transition-colors truncate"
        >
          {{ f.target?.title }}
        </a>
        <ng-template #khongCoThe>
          <span class="block text-white font-medium truncate">{{ f.target_id }}</span>
        </ng-template>
      </div>

      <button
        type="button"
        (click)="boTheoDoi(f)"
        class="text-slate-400 hover:text-red-400 transition-colors px-3 py-2 shrink-0"
        [attr.aria-label]="'Bỏ theo dõi ' + (f.target?.title || f.target_id)"
      >
        Bỏ theo dõi
      </button>
    </li>
  </ul>
</div>
