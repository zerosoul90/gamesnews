<header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
  <nav class="container mx-auto px-4 flex items-center justify-between h-16">
    <a routerLink="/deals" class="text-white font-bold text-xl tracking-tight hover:text-blue-400 transition-colors">
      GameNews
    </a>

    <!-- Desktop -->
    <ul class="hidden md:flex items-center gap-1">
      <li *ngFor="let m of muc">
        <a
          [routerLink]="m.duongDan"
          routerLinkActive="bg-slate-800 text-white"
          class="px-4 py-2 rounded text-slate-300 hover:text-white hover:bg-slate-800 transition-colors block"
          >{{ m.nhan }}</a
        >
      </li>
    </ul>

    <!-- Nút mở menu trên màn hình hẹp. `aria-expanded` để trình đọc màn hình
         biết trạng thái, không chỉ là một hình ba gạch. -->
    <button
      type="button"
      class="md:hidden text-slate-300 hover:text-white p-2"
      [attr.aria-expanded]="dangMoMobile"
      aria-controls="menu-mobile"
      aria-label="Mở menu"
      (click)="doiMenuMobile()"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
  </nav>

  <!-- Mobile: đóng lại sau khi chọn, nếu không thì menu che mất trang vừa mở. -->
  <ul *ngIf="dangMoMobile" id="menu-mobile" class="md:hidden border-t border-slate-800 px-4 pb-3">
    <li *ngFor="let m of muc">
      <a
        [routerLink]="m.duongDan"
        routerLinkActive="text-white bg-slate-800"
        (click)="dongMenuMobile()"
        class="block px-4 py-3 rounded text-slate-300 hover:text-white hover:bg-slate-800 transition-colors"
        >{{ m.nhan }}</a
      >
    </li>
  </ul>
</header>
