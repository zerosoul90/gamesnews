name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest

    services:
      # Token bucket nằm trong script Lua, phải chạy trên Redis thật mới có
      # ý nghĩa. Không có service này thì test rate limiter tự bỏ qua.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Ràng buộc unique một phần và cơ chế "chỉ ghi khi content_hash đổi" là
      # hành vi của chính Mongo, mock lại thì test chỉ kiểm được cái mock.
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        # Biểu thức JS phải nằm trong nháy đơn. `options` ở đây là chuỗi, nên
        # Docker chạy healthcheck qua `sh -c` — khác hẳn dạng mảng exec trong
        # docker-compose.yml. Để trần thì cặp ngoặc đơn của `adminCommand(...)`
        # bị shell đọc như cú pháp subshell: `sh: 1: Syntax error: "(" unexpected`,
        # healthcheck không bao giờ xanh và service bị coi là chết.
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Chất lượng tìm kiếm tiếng Việt là checkpoint khó nhất của Phase 1 và
      # phụ thuộc vào tokenizer + ranking rules của Meilisearch, không phải vào
      # code của ta. Chỉ chạy thật mới biết nó còn đúng.
      meilisearch:
        image: getmeili/meilisearch:v1.11
        ports:
          - 7700:7700
        env:
          MEILI_MASTER_KEY: ci-test-master-key-not-a-secret
          MEILI_ENV: production
          MEILI_NO_ANALYTICS: "true"
        options: >-
          --health-cmd "curl --fail http://localhost:7700/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_MONGO_URI: mongodb://localhost:27017
      TEST_MEILI_URL: http://localhost:7700
      MEILI_MASTER_KEY: ci-test-master-key-not-a-secret
      # Trên CI không kho nào được phép skip: skip im lặng nghĩa là phần logic
      # quan trọng nhất coi như chưa bao giờ được kiểm.
      REQUIRE_REDIS: "1"
      REQUIRE_MONGO: "1"
      REQUIRE_MEILI: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cài phụ thuộc đúng theo lock
        run: uv sync --frozen

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy app tests

      - name: pytest
        run: uv run pytest

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker-compose.yml phải hợp lệ
        run: |
          cp .env.example .env
          sed -i 's/^MEILI_MASTER_KEY=.*/MEILI_MASTER_KEY=ci-placeholder-key/' .env
          docker compose config --quiet
