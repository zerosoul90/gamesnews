{# Khung chung cho trang admin. Không CDN, không framework: trang này chỉ cần
   đọc được và bấm được, và nó phải chạy cả khi máy chủ không ra được Internet. #}
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Admin entity{% endblock %} — gamesnews</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 system-ui, "Segoe UI", sans-serif; margin: 0 auto; padding: 1.5rem;
         max-width: 60rem; }
  h1 { font-size: 1.3rem; margin: 0; }
  header { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1.2rem; }
  header nav { margin-left: auto; font-size: .9rem; }
  a { color: inherit; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .35rem .6rem; border-bottom: 1px solid #8884; vertical-align: top; }
  th { font-weight: 600; white-space: nowrap; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; }
  form.inline { display: flex; gap: .5rem; flex-wrap: wrap; }
  input[type=text], input[type=password], textarea { font: inherit; padding: .35rem .5rem;
         border: 1px solid #8886; border-radius: 4px; background: transparent; color: inherit; }
  textarea { width: 100%; min-height: 9rem; }
  button { font: inherit; padding: .35rem .9rem; border-radius: 4px; border: 1px solid #8886;
         background: #8882; color: inherit; cursor: pointer; }
  .muted { color: #8889; }
  .warn { border-left: 3px solid #c94; padding-left: .8rem; }
  section { margin: 1.6rem 0; }
</style>
</head>
<body>
<header>
  <h1><a href="/admin" style="text-decoration:none">Admin entity</a></h1>
  <nav>{% block nav %}
    <form method="post" action="/admin/logout" class="inline"><button>Đăng xuất</button></form>
  {% endblock %}</nav>
</header>
{% block content %}{% endblock %}
</body>
</html>
