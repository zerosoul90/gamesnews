# Sáu service theo PHASE-0.md mục 2.
# `app` và `worker` dùng chung image và code, chỉ khác lệnh khởi động.
# Cổng của kho dữ liệu KHÔNG expose ra host — khi cần debug thì tạo
# docker-compose.override.yml (đã nằm trong .gitignore), xem file .example.

name: gamesnews

x-app-base: &app-base
  build:
    context: .
  image: gamesnews-app:dev
  restart: unless-stopped
  env_file: .env
  environment:
    MONGO_URI: mongodb://mongo:27017
    REDIS_URL: redis://redis:6379/0
    MEILI_URL: http://meilisearch:7700
    QDRANT_URL: http://qdrant:6333
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy
    meilisearch:
      condition: service_healthy
    qdrant:
      condition: service_started

services:
  app:
    <<: *app-base
    ports:
      - "${APP_PORT:-8000}:8000"

  worker:
    <<: *app-base
    command: ["arq", "app.jobs.worker.WorkerSettings"]

  web:
    build:
      context: ./web
    ports:
      - "4200:4000"
    restart: unless-stopped
    environment:
      # Chỉ phía SSR đọc biến này. Browser vẫn gọi `http://localhost:8000` theo
      # environment.ts vì nó chạy trên máy người dùng, nơi `app` không phân giải được.
      API_BASE_URL: http://app:8000
    depends_on:
      app:
        condition: service_started

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly: job đang chờ trong hàng đợi Arq không được mất khi restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?bắt buộc, xem .env.example}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    # Không có healthcheck: image không kèm curl/wget. `app` chỉ cần
    # service_started vì Qdrant chưa dùng tới Phase 6 (PHASE-0.md mục 4).

  umami-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami_password
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 10s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:umami_password@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: some_random_secret_string_for_umami_123
    ports:
      - "3000:3000"
    depends_on:
      umami-db:
        condition: service_healthy

volumes:
  mongo-data:
  redis-data:
  meili-data:
  qdrant-data:
  umami-db-data:
