[project]
name = "gamesnews"
version = "0.1.0"
description = "Nền tảng tổng hợp thông tin game đa ngôn ngữ, ưu tiên thị trường Việt Nam"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "motor>=3.6",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "ASYNC",    # flake8-async
    "S",        # bandit
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert là chuyện bình thường trong test
# Ký tự "nhập nhằng" (fullwidth, nháy cong) chính là thứ đang được kiểm.
"tests/test_normalize.py" = ["S101", "RUF001"]
"app/services/normalize.py" = ["RUF001"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["motor.*", "arq.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
