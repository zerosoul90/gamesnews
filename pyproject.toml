[project]
name = "gamesnews"
version = "0.1.0"
description = "Nền tảng tổng hợp thông tin game đa ngôn ngữ, ưu tiên thị trường Việt Nam"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "motor>=3.6",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.27",
    # Trang admin của Phase 1: server-render, không kéo Angular vào sớm.
    "jinja2>=3.1",
    # FastAPI cần gói này để đọc form HTML (`Form(...)`).
    "python-multipart>=0.0.9",
    "google-play-scraper>=1.2.7",
    # `[crypto]` để ký RS256: FCM HTTP v1 xác thực bằng JWT assertion của
    # service account, mà HS256 không dùng được ở đó.
    "pyjwt[crypto]>=2.13.0",
    "feedparser>=6.0.14",
    "simhash>=2.1.2",
    # Sinh ảnh thẻ chia sẻ phía server (PHASE-4 checkpoint). `api/seo.py`
    # bọc import trong try/except nên thiếu nó thì app vẫn chạy nhưng tính
    # năng lặng lẽ không bao giờ hoạt động.
    "pillow>=11.0",
    "beautifulsoup4>=4.15.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "ASYNC",    # flake8-async
    "S",        # bandit
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",
]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)`/`Security(...)` trong giá trị mặc định là đúng idiom của
# FastAPI: framework gọi chúng một lần lúc dựng route chứ không phải mỗi
# request, nên cảnh báo "mutable default" của B008 không áp dụng ở đây.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert là chuyện bình thường trong test
# Ký tự "nhập nhằng" (fullwidth, nháy cong) chính là thứ đang được kiểm.
"tests/test_normalize.py" = ["S101", "RUF001"]
"app/services/normalize.py" = ["RUF001"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# google_play_scraper không kèm type stub — adapter của ta bọc nó lại và tự
# khai kiểu ở biên, nên phần bên trong không cần mypy soi.
# Ba thư viện này không kèm type stub. Adapter/service của ta tự khai kiểu ở
# biên, nên phần bên trong không cần mypy soi.
module = ["motor.*", "arq.*", "google_play_scraper.*", "feedparser.*", "simhash.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
